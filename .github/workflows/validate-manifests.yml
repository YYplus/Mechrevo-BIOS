name: Validate manifests

on:
  push:
    paths:
      - "models/**/manifest.yaml"
      - "tools/validate/**"
  pull_request:
    paths:
      - "models/**/manifest.yaml"
      - "tools/validate/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: python tools/validate/validate_manifest.py
