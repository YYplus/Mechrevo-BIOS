name: 固件提交
description: 提交机械革命 BIOS / EC 版本、官方来源或适用机型信息
title: "[Firmware] "
body:
  - type: input
    id: model
    attributes:
      label: 机械革命机型
      placeholder: 例如：耀世 15 Pro
    validations:
      required: true

  - type: dropdown
    id: firmware_type
    attributes:
      label: 固件类型
      options:
        - BIOS
        - EC
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 固件版本
      placeholder: 例如：N.1.15MRO10
    validations:
      required: true

  - type: input
    id: filename
    attributes:
      label: 原始文件名
      placeholder: 例如：X6AR45xUN115MRO10_CAP.EXE

  - type: input
    id: source
    attributes:
      label: 官方下载地址
      placeholder: 优先提供机械革命官方地址

  - type: input
    id: platform
    attributes:
      label: 平台 / 适用年份
      placeholder: 例如：X6AR45xU / 2024–2026

  - type: textarea
    id: ec
    attributes:
      label: EC / 配套信息
      description: 如已知，请填写配套 EC 版本或其他相关信息。

  - type: textarea
    id: notes
    attributes:
      label: 其他说明
